[package]
name = "markgo-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "Apache-2.0"
description = "Source-preserving editor foundation for MarkGo's GPUI migration"

[dependencies]
pulldown-cmark = { version = "=0.13.6", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
