[package]
name = "markgo-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
description = "MarkGo native Markdown workbench"

[features]
default = []
desktop = ["dep:gpui-kit", "dep:anyhow"]
render-check = ["desktop", "gpui-kit/test-support"]

[[bin]]
name = "markgo"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "render_check"
required-features = ["render-check"]

[dependencies]
pulldown-cmark = { version = "=0.13.6", default-features = false }
unicode-segmentation = "=1.13.3"
gpui-kit = { version = "=0.9.1", optional = true }
anyhow = { version = "=1.0.102", optional = true }

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
