name: Rust foundation

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
