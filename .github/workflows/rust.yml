name: Rust client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features

  desktop:
    name: GPUI desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: cargo clippy --locked --features render-check --all-targets -- -D warnings
      - run: cargo build --locked --bin markgo
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh
      - name: Package Windows portable client
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/bundle-windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: markgo-${{ runner.os }}
          path: build/MarkGo*
          if-no-files-found: error
